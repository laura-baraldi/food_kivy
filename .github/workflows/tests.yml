name: Application tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests kivy keyring pytest pytest-cov

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Create test configuration
        run: |
          printf '%s\n' \
            'SUPABASE_URL = "https://example.supabase.co"' \
            'SUPABASE_KEY = "test-key"' \
            > config.py

      - name: Run Python tests with coverage
        run: |
          xvfb-run -a python -m pytest \
            --cov=app.auth.auth_client \
            --cov=app.core.android_token_store \
            --cov=app.core.desktop_token_store \
            --cov=app.auth.auth_screen \
            --cov=app.food.food_lists_screen \
            --cov=app.food.food_list_popups \
            --cov=app.food.food_popup \
            --cov=app.food.group_members_popup \
            --cov=app.i18n.language_settings \
            --cov=main \
            --cov=app.recipes.recipe_client \
            --cov=app.recipes.recipe_popup \
            --cov=app.core.session_storage \
            --cov=app.auth.signup_screen \
            --cov=app.core.supabase_client \
            --cov=app.i18n.translations \
            --cov=app.ui.ui_components \
            --cov-report=term-missing \
            --cov-fail-under=100

  recipe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: supabase/functions/generate-recipe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"

      - name: Check formatting
        run: deno fmt --check index.ts index_test.ts

      - name: Check TypeScript types
        run: deno check index.ts index_test.ts

      - name: Lint recipe function and tests
        run: deno lint index.ts index_test.ts

      - name: Run recipe tests with coverage
        run: deno test --allow-env --coverage=coverage index_test.ts

      - name: Require full recipe coverage
        run: deno coverage coverage --include='generate-recipe/index\.ts$' --threshold=100

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Run SQL quota tests
        run: supabase test db supabase/tests/database/recipe_rate_limit_test.sql

      - name: Run concurrent quota tests
        run: |
          python supabase/tests/database/recipe_rate_limit_concurrency_test.py \
            --container supabase_db_food_kivy

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

